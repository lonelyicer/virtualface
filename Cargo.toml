[workspace]
resolver = "3"
members = [
    "crates/vf-abi",
    "crates/vf-sdk",
    "crates/vf-core",
    "crates/vf-ui",
    "crates/vf-app",
    "plugins/vf-plugin-pico",
    "plugins/vf-plugin-unified",
    "plugins/vf-plugin-vrc-osc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/lonelyicer/virtualface"

[workspace.dependencies]
vf-abi = { path = "crates/vf-abi" }
vf-sdk = { path = "crates/vf-sdk" }
vf-core = { path = "crates/vf-core" }
vf-ui = { path = "crates/vf-ui" }

gpui-kit = "0.6"
libloading = "0.8"
petgraph = "0.8"
crossbeam-channel = "0.5"
arc-swap = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

# Keep the UI responsive in development builds without optimizing the whole workspace.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
